services:
  api:
    container_name: backend-api-1
    build: .
    command: ["migrate", "npm", "start"]
    # Ports can stay or be internal, caddy will proxy to 4050 directly
    ports:
      - "4050:4050"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app

  worker:
    container_name: backend-worker-1
    build: .
    command: ["npm", "run", "worker"]
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app

  sqlite-web:
    container_name: backend-sqlite-web-1
    image: coleifer/sqlite-web
    entrypoint: ["sqlite_web", "--host", "0.0.0.0", "--port", "8080", "/data/sqlite.db"]
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - app

  # Adding the missing Caddy service that manages everything
  caddy:
    container_name: backend-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "5001:5001" # Your new database web UI port
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy:/data
      - ./uploads:/app/uploads # Shared to let caddy serve static uploads directly
    env_file:
      - .env
    networks:
      - app

networks:
  app:
    name: backend_app # Force the network name to match what frontend expects