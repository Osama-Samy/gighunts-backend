version: "3.8"

services:
  api:
    build: .
    command: ["migrate", "npm", "start"]
    ports:
      - "4050:4050"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app

  worker:
    build: .
    command: ["npm", "run", "worker"]
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - app

  sqlite-web:
    image: coleifer/sqlite-web
    entrypoint: ["sqlite_web", "--host", "0.0.0.0", "--port", "8080", "/data/sqlite.db"]
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - app

networks:
  app: